
services:
  flotix-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flotix-platform-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
      TOKEN_SECRET: ${TOKEN_SECRET}
      Authorization__Enabled: ${AUTHORIZATION_ENABLED:-false}
    depends_on:
      flotix-db:
        condition: service_healthy

  flotix-db:
    image: postgres:17-alpine
    container_name: flotix-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flotix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flotix-postgres-data:

